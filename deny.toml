[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "CC0-1.0",
  "Zlib",
  "CDLA-Permissive-2.0",
  "bzip2-1.0.6",
  # Category-A: https://issues.apache.org/jira/browse/LEGAL-660
  "Unicode-3.0",
  # Boost Software License Version 1.0 is allowed (Category-A):
  # https://www.apache.org/legal/resolved.html#category-a
  "BSL-1.0",
]

exceptions = [
  # The MPL license is allowed (binary-only):
  # https://www.apache.org/legal/resolved.html#category-b
  { allow = ["MPL-2.0"], crate = "webpki-roots" },
  { allow = ["MPL-2.0"], crate = "generational-arena" },
  { allow = ["MPL-2.0"], crate = "option-ext" },
]

[advisories]
# Only unmaintained advisories on DIRECT workspace dependencies fail the gate; transitive
# unmaintained crates (currently: paste, rustls-pemfile) are accepted — we cannot bump them
# without a sanctioned dependency sync.
unmaintained = "workspace"
# Known advisories in the pinned lockfile. Originally recorded 2026-07-10 (audit remediation
# Tier 3); RE-AUDITED 2026-08-22 against the live lockfile and the advisory DB. Dependency bumps
# are out of policy for routine work (see AGENTS.md); each entry below is a deliberate, dated
# acceptance — remove it when the affected crate is cleared. New advisories NOT in this list fail
# the gate.
#
# 2026-08-22 re-audit. FOUR entries were removed because the crates are now PATCHED, not because
# they were merely undetected — every locked version was checked against the advisory's own
# `patched` range: crossbeam-epoch 0.9.20 vs >= 0.9.20 (RUSTSEC-2026-0204), anyhow 1.0.104 vs
# >= 1.0.103 (RUSTSEC-2026-0190), quinn-proto 0.11.16 vs >= 0.11.15 (RUSTSEC-2026-0185), and
# rkyv 0.8.17 vs >= 0.8.16 (RUSTSEC-2026-0122). The 2026-08-05 datafusion 54.1 family bump
# cleared all four. The prior rationale on the quinn-proto and rkyv entries ("absent from the
# HOST-resolved graph, kept so both tools stay clean") is therefore ALSO stale — they are fixed
# on every target now, so cargo-audit will not flag them either.
ignore = [
  # quick-xml (three locked versions: 0.37.5 / 0.38.4 / 0.39.4): memory-exhaustion DoS via
  # unbounded namespace declarations in NsReader — transitive, XML paths not exposed to
  # untrusted input here. STILL VULNERABLE: patched is >= 0.41.0, well above every locked
  # version, so this stays until a sanctioned bump moves quick-xml.
  "RUSTSEC-2026-0195",
  # quick-xml: quadratic runtime on duplicate start-tag attribute names — same exposure, same
  # >= 0.41.0 patch floor, same reason to stay.
  "RUSTSEC-2026-0194",
]
